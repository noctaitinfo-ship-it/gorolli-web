name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - main
      - redesign/gorolli-finder-demand-first
      - marketing/international-seo-2026-07
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-gorolli-web-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gorolli-web --branch=${{ github.ref_name }}

      - name: Publish preview URL
        if: always()
        run: |
          echo "## Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.cloudflare.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
